[project]
name = "rubiks-cube-scrambler"
version = "0.1.0"
description = "Rubik's cube scrambler, 3D visualization and algorithm learning tool"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.0.0",
    "ursina>=5.0.0",
    "pillow>=9.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
